[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["chess==1.11.2", "numpy>=2.1"]

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "pytest>=8"]
# training deps (torch, onnx, ...) live in training/requirements.txt; they are not
# needed for `make gate` and only run on the training machine.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# fastchess.py is a numba dialect: single-letter uint/int aliases, tight
# paired statements in the move loops, and explicit comparisons the JIT likes.
"fastchess.py" = ["E702", "E741", "SIM108", "SIM109", "SIM114", "N806", "N803"]

[tool.mypy]
strict = true
files = [
    "agent.py",
    "alphabeta.py",
    "book.py",
    "encoding.py",
    "endgame.py",
    "evaluation.py",
    "inference.py",
    "search.py",
    "harness",
    "tools",
]

[[tool.mypy.overrides]]
module = ["chess.*", "onnxruntime.*", "numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastchess"]
ignore_errors = true  # numba dialect - not meaningfully checkable by mypy

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
